services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      - APP_NAME=Tadbirkor.uz
      - APP_URL=http://localhost:8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tadbirkor
      - DB_USER=tadbirkor_user
      - DB_PASSWORD=tadbirkor_pass
    depends_on:
      - db
    volumes:
      - ./storage:/var/www/html/storage

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=tadbirkor
      - MYSQL_USER=tadbirkor_user
      - MYSQL_PASSWORD=tadbirkor_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "3306:3306"

volumes:
  db_data:
